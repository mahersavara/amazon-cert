# Publishes the web quiz (web/ + data built from quiz/questions.json) to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy web quiz

on:
  push:
    branches: [main]
    paths: ["web/**", "quiz/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python quiz/test_quiz.py
      - run: python quiz/export_web.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
